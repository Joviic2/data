name: Update data

on:
  push:
    paths:
      - "fetch_acb.py"
      - "index.html"
      - "fetch_lnb.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "*/15 * * * *"   # svakih 15 minuta (GitHub zna da kasni nekoliko minuta)
  workflow_dispatch:         # dugme za rucno pokretanje

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Chromium for ACB Live stats
        run: python -m playwright install chromium
      - run: python fetch_data.py
      - run: python build_site.py
      - run: python fetch_shots.py
        continue-on-error: true
      - run: python fetch_pbp.py
        continue-on-error: true
      - run: python fetch_odds.py
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: python fetch_aba.py
      - name: Scrape ACB calendar and boxscores
        run: python fetch_acb.py
      - name: Commit data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Update data" && git pull --rebase && git push)
